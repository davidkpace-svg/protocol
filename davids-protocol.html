<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="David's Protocol">
  <meta name="theme-color" content="#050810">
  <title>David's Peptide Protocol</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap');
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{min-height:100%;background:#050810;overflow-x:hidden;color:#cdd;font-family:'Rajdhani',system-ui,sans-serif}
    body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
    button{-webkit-appearance:none;border:none;background:none;cursor:pointer;font-family:inherit;outline:none}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-thumb{background:#223;border-radius:4px}
    .ob{font-family:'Orbitron',monospace}
  </style>
</head>
<body>
<div id="app"></div>
<script>
var C={green:'#00ff88',teal:'#00e5cc',blue:'#00cfff',purple:'#bf5fff',pink:'#ff4db8',orange:'#ff8c00',yellow:'#ffe600',amber:'#ffb300'};
var DAYS=['MON','TUE','WED','THU','FRI','SAT','SUN'];
var DK=['M','T','W','TH','F','SA','SU'];

var BLOCKS=[
  {id:'6am',time:'6:00 AM',label:'First Window',sub:'Morning Mix',
   col:C.green,grad:'linear-gradient(135deg,#00ff8810,#00e5cc08)',bor:'#00ff8828',
   groups:[
    {id:'inj',icon:'💉',label:'Injectables',note:'Combine in 1–2 syringes',items:[
      {id:'klow', name:'KLOW Blend',          dose:'10u', days:'all',       col:C.green},
      {id:'nad',  name:'NAD+',                dose:'10u', days:'all',       col:C.teal},
      {id:'semax',name:'Semax / Selank Blend',dose:'5–8u',days:'all',       col:C.green},
      {id:'ghk',  name:'GHK-Cu',              dose:'5–8u',days:'all',       col:C.teal},
      {id:'igf',  name:'IGF-1 LR3',           dose:'8u',  days:'all',       col:C.green},
      {id:'pt141',name:'PT-141',              dose:'10u', days:['M','W','F'],col:C.blue,note:'Mon · Wed · Fri'},
    ]},
    {id:'oral',icon:'💊',label:'Oral',note:'',items:[
      {id:'prewkt',name:'Bucked Up Pre-Workout',  dose:'1 scoop',days:'workout',col:C.amber},
      {id:'aminos',name:'Bucked Up Racked Aminos',dose:'1 scoop',days:'all',    col:C.teal},
      {id:'vitd',  name:'Vitamin D',              dose:'Daily',  days:'all',    col:C.yellow},
      {id:'slupp', name:'SLU-PP-332',             dose:'1 cap',  days:'all',    col:C.green},
    ]},
  ]},
  {id:'830',time:'8:30 AM',label:'Second Window',sub:'Hydration & Performance',
   col:C.blue,grad:'linear-gradient(135deg,#00cfff10,#00cfff06)',bor:'#00cfff22',
   groups:[
    {id:'perf',icon:'⚡',label:'Supplements',note:'',items:[
      {id:'electro',name:'Redmond Re-Lyte Electrolytes + Creatine',dose:'Daily',days:'all',col:C.blue},
    ]},
  ]},
  {id:'eve',time:'Evening / Bedtime',label:'Final Window',sub:'Recovery & Sleep',
   col:C.purple,grad:'linear-gradient(135deg,#bf5fff10,#ff4db808)',bor:'#bf5fff28',
   groups:[
    {id:'einj',icon:'💉',label:'Injectables',note:'',items:[
      {id:'oxycjc',name:'Oxytocin + CJC Blend + DSIP',  dose:'10u + 10u + 5–7u',days:'all',    col:C.purple,note:'Mix together'},
      {id:'kiss',  name:'Kisspeptin (separate syringe)',dose:'10u',             days:['M','F'],col:C.pink,  note:'Mon & Fri'},
    ]},
    {id:'eoral',icon:'💊',label:'Oral',note:'',items:[
      {id:'mag', name:'Jocko Magnesium',dose:'Daily',days:'all',col:C.purple},
      {id:'hair',name:'Hair Vitamins',  dose:'Daily',days:'all',col:C.pink},
    ]},
  ]},
  {id:'wk',time:'Sunday Only',label:'Weekly Injection',sub:'Once per week',
   col:C.orange,grad:'linear-gradient(135deg,#ff8c0012,#ff8c0006)',bor:'#ff8c0022',
   groups:[
    {id:'winj',icon:'📅',label:'Weekly Injectable',note:'',items:[
      {id:'retat',name:'Retatrutide',dose:'50u',days:['SU'],col:C.orange},
    ]},
  ]},
];

var TABLE=[
  {name:'KLOW Blend (10u)',        col:C.green, days:'all'},
  {name:'NAD+ (10u)',              col:C.teal,  days:'all'},
  {name:'Semax/Selank (5–8u)',     col:C.green, days:'all'},
  {name:'GHK-Cu (5–8u)',           col:C.teal,  days:'all'},
  {name:'IGF-1 LR3 (8u)',          col:C.green, days:'all'},
  {name:'PT-141 (10u)',            col:C.blue,  days:['M','W','F']},
  {name:'Racked Aminos',           col:C.teal,  days:'all'},
  {name:'SLU-PP-332 (1 cap)',      col:C.green, days:'all'},
  {name:'Electrolytes + Creatine', col:C.blue,  days:'all'},
  {name:'Oxytocin + CJC + DSIP',   col:C.purple,days:'all'},
  {name:'Kisspeptin (10u)',        col:C.pink,  days:['M','F']},
  {name:'Jocko Magnesium',         col:C.purple,days:'all'},
  {name:'Hair Vitamins',           col:C.pink,  days:'all'},
  {name:'Retatrutide (50u)',       col:C.orange,days:['SU']},
];

// State
var S={tab:0,day:0,workout:false,checked:{}};

function isOn(days,dk,wo){
  if(days==='workout')return wo;
  if(days==='all')return true;
  return Array.isArray(days)&&days.indexOf(dk)>=0;
}
function dotOn(days,dk){
  if(days==='all')return true;
  return Array.isArray(days)&&days.indexOf(dk)>=0;
}
function dayCol(i){
  if(i===6)return C.orange;
  if(i===0||i===2||i===4)return C.blue;
  return C.green;
}
function isChk(id){return!!S.checked[S.day+'_'+id];}

function setTab(t){S.tab=t;render();}
function setDay(d){S.day=d;render();}
function toggleWO(){S.workout=!S.workout;render();}
function toggleChk(id){var k=S.day+'_'+id;S.checked[k]=!S.checked[k];render();}
function resetDay(){
  var pre=S.day+'_';
  Object.keys(S.checked).forEach(function(k){if(k.indexOf(pre)===0)delete S.checked[k];});
  render();
}

function dot(on,col,sz){
  sz=sz||12;
  return '<div style="width:'+sz+'px;height:'+sz+'px;border-radius:50%;flex-shrink:0;'+
    'background:'+(on?col:'transparent')+';'+
    'border:1.5px solid '+(on?col:'#233')+';'+
    'box-shadow:'+(on?'0 0 7px 1px '+col+'77':'none')+';'+
    'margin:0 auto;"></div>';
}

function checkRow(it,dk,wo){
  var on=isOn(it.days,dk,wo);
  var chk=isChk(it.id);
  var isWO=it.days==='workout';
  return '<div onclick="toggleChk(\''+it.id+'\')" style="'+
    'display:flex;align-items:center;gap:10px;'+
    'padding:9px 10px;border-radius:8px;margin-bottom:5px;'+
    'background:'+(chk?it.col+'16':on?'#09101a':'#06080f')+';'+
    'border:1px solid '+(chk?it.col+'44':on?'#1a2535':'#0d1220')+';'+
    'cursor:'+(on?'pointer':'default')+';'+
    'opacity:'+(on?1:0.25)+';min-height:46px;">'+
    '<div style="width:20px;height:20px;border-radius:5px;flex-shrink:0;'+
      'background:'+(chk?it.col:'transparent')+';'+
      'border:2px solid '+(chk?it.col:'#334')+';'+
      'box-shadow:'+(chk?'0 0 10px '+it.col+'99':'none')+';'+
      'display:flex;align-items:center;justify-content:center;">'+
      (chk?'<span style="color:#000;font-size:12px;font-weight:900;line-height:1;">&#10003;</span>':'')+
    '</div>'+
    '<div style="flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">'+
      '<span style="font-family:Rajdhani,sans-serif;font-size:15px;font-weight:600;'+
        'color:'+(chk?it.col:on?'#99aabb':'#334')+';'+
        'text-decoration:'+(chk?'line-through':'none')+';'+
        'text-shadow:'+(chk?'0 0 8px '+it.col+'66':'none')+';">'+it.name+'</span>'+
      (isWO?'<span style="font-size:9px;padding:2px 8px;border-radius:10px;'+
        'background:#ffb30015;border:1px solid #ffb30033;color:#ffb300bb;'+
        'font-family:monospace;letter-spacing:1px;">WORKOUT</span>':'')+
      (it.note&&!isWO?'<span style="font-size:10px;color:#445;font-family:monospace;">'+it.note+'</span>':'')+
    '</div>'+
    '<span style="font-family:Orbitron,monospace;font-size:11px;font-weight:700;white-space:nowrap;'+
      'color:'+(chk?it.col:on?it.col+'99':'#223')+';'+
      'text-shadow:'+(chk?'0 0 10px '+it.col:'none')+';">'+it.dose+'</span>'+
  '</div>';
}

function scheduleTab(){
  var dk=DK[S.day];
  var wo=S.workout;
  var total=0,done=0;
  BLOCKS.forEach(function(b){b.groups.forEach(function(g){g.items.forEach(function(it){
    if(isOn(it.days,dk,wo)){total++;if(isChk(it.id))done++;}
  });});});
  var pct=total?(done/total*100):0;
  var h='';

  // Day selector
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;'+
    'margin-bottom:12px;background:#080c14;border-radius:12px;padding:5px;border:1px solid #1a2030;">';
  DAYS.forEach(function(d,i){
    var on=S.day===i;var dc=dayCol(i);
    h+='<button onclick="setDay('+i+')" style="'+
      'background:'+(on?dc+'18':'transparent')+';'+
      'border:1px solid '+(on?dc+'55':'transparent')+';'+
      'border-radius:8px;padding:8px 2px;cursor:pointer;min-height:46px;">'+
      '<div style="font-family:Orbitron,monospace;font-size:8px;font-weight:700;letter-spacing:0.5px;'+
        'color:'+(on?dc:'#334')+';text-shadow:'+(on?'0 0 10px '+dc:'none')+';">'+d+'</div>'+
      (on?'<div style="width:4px;height:4px;border-radius:50%;background:'+dc+';'+
        'margin:4px auto 0;box-shadow:0 0 6px '+dc+';"></div>':'')+
    '</button>';
  });
  h+='</div>';

  // Workout toggle + progress
  h+='<div style="display:flex;gap:8px;margin-bottom:12px;align-items:stretch;">';
  h+='<button onclick="toggleWO()" style="'+
    'padding:0 16px;border-radius:10px;cursor:pointer;'+
    'background:'+(wo?C.amber+'20':'#080c14')+';'+
    'border:1px solid '+(wo?C.amber+'66':'#1a2030')+';'+
    'flex-shrink:0;display:flex;flex-direction:column;align-items:center;'+
    'justify-content:center;gap:4px;min-height:52px;min-width:72px;">'+
    '<span style="font-size:20px;">&#127947;</span>'+
    '<span style="font-family:Orbitron,monospace;font-size:7px;font-weight:700;letter-spacing:1px;'+
      'color:'+(wo?C.amber:'#334')+';text-shadow:'+(wo?'0 0 10px '+C.amber:'none')+';white-space:nowrap;">'+
      (wo?'WORKOUT ✓':'WORKOUT?')+'</span>'+
  '</button>';
  h+='<div style="flex:1;display:flex;align-items:center;gap:10px;'+
    'background:#080c14;border-radius:10px;padding:10px 14px;border:1px solid #1a2030;">'+
    '<span style="font-family:Orbitron,monospace;font-size:7px;color:#3a4a5a;letter-spacing:1.5px;white-space:nowrap;">PROGRESS</span>'+
    '<div style="flex:1;height:6px;background:#10182a;border-radius:6px;overflow:hidden;">'+
      '<div style="height:100%;border-radius:6px;width:'+pct+'%;'+
        'background:linear-gradient(90deg,#00ff88,#00cfff);box-shadow:0 0 10px #00ff8866;"></div>'+
    '</div>'+
    '<span style="font-family:Orbitron,monospace;font-size:12px;font-weight:700;white-space:nowrap;'+
      'color:'+(pct===100?C.green:C.teal)+';'+
      'text-shadow:'+(pct===100?'0 0 12px '+C.green:'none')+';">'+
      done+'/'+total+(pct===100?' ✓':'')+
    '</span>'+
  '</div>';
  h+='</div>';

  // Time blocks
  BLOCKS.forEach(function(block){
    var hasActive=false;
    block.groups.forEach(function(g){g.items.forEach(function(it){if(isOn(it.days,dk,wo))hasActive=true;});});
    h+='<div style="background:'+block.grad+';border:1px solid '+block.bor+';'+
      'border-radius:14px;padding:14px;margin-bottom:10px;'+
      'opacity:'+(hasActive?1:0.38)+';">';
    h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;">'+
      '<div style="background:'+block.col+'20;border:1px solid '+block.col+'44;'+
        'border-radius:8px;padding:5px 13px;font-family:Orbitron,monospace;font-size:13px;font-weight:900;'+
        'color:'+block.col+';text-shadow:0 0 14px '+block.col+';letter-spacing:1px;white-space:nowrap;">'+
        block.time+'</div>'+
      '<div>'+
        '<div style="font-family:Orbitron,monospace;font-size:9px;font-weight:700;color:'+block.col+';letter-spacing:2px;">'+block.label.toUpperCase()+'</div>'+
        '<div style="font-size:11px;color:#3a4a5a;">'+block.sub+'</div>'+
      '</div>'+
      (!hasActive?'<span style="margin-left:auto;font-size:8px;padding:3px 10px;border-radius:10px;'+
        'background:#0d1220;border:1px solid #1a2030;color:#334;font-family:monospace;letter-spacing:1px;">NOT TODAY</span>':'')+
    '</div>';
    block.groups.forEach(function(g){
      h+='<div style="margin-bottom:8px;">'+
        '<div style="display:flex;align-items:center;gap:6px;margin-bottom:7px;">'+
          '<span style="font-size:13px;">'+g.icon+'</span>'+
          '<span style="font-family:Orbitron,monospace;font-size:8px;color:#3a4a5a;letter-spacing:2px;">'+g.label+'</span>'+
          (g.note?'<span style="font-size:9px;color:#28364a;font-family:monospace;">— '+g.note+'</span>':'')+
        '</div>';
      g.items.forEach(function(it){h+=checkRow(it,dk,wo);});
      h+='</div>';
    });
    h+='</div>';
  });

  h+='<div style="text-align:center;margin-top:6px;margin-bottom:20px;">'+
    '<button onclick="resetDay()" style="background:transparent;border:1px solid #1a2030;border-radius:8px;'+
      'padding:10px 28px;cursor:pointer;font-family:Orbitron,monospace;font-size:8px;color:#334;'+
      'letter-spacing:2px;min-height:44px;">&#8635;  RESET TODAY</button>'+
  '</div>';
  return h;
}

function overviewTab(){
  var h='<div style="margin-bottom:8px;">';
  BLOCKS.forEach(function(block){
    h+='<div style="background:'+block.grad+';border:1px solid '+block.bor+';'+
      'border-radius:14px;padding:14px;margin-bottom:10px;">';
    h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">'+
      '<div style="background:'+block.col+'20;border:1px solid '+block.col+'44;'+
        'border-radius:8px;padding:5px 13px;font-family:Orbitron,monospace;font-size:13px;font-weight:900;'+
        'color:'+block.col+';text-shadow:0 0 14px '+block.col+';letter-spacing:1px;">'+block.time+'</div>'+
      '<div style="font-family:Orbitron,monospace;font-size:9px;font-weight:700;color:'+block.col+';letter-spacing:2px;">'+block.label.toUpperCase()+'</div>'+
    '</div>';
    block.groups.forEach(function(g){
      h+='<div style="margin-bottom:8px;">'+
        '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">'+
          '<span>'+g.icon+'</span>'+
          '<span style="font-family:Orbitron,monospace;font-size:8px;color:#3a4a5a;letter-spacing:2px;">'+g.label+'</span>'+
          (g.note?'<span style="font-size:9px;color:#28364a;font-family:monospace;">— '+g.note+'</span>':'')+
        '</div>';
      g.items.forEach(function(it){
        var dots='';
        DK.forEach(function(dk2){dots+='<div style="margin:0 1px;">'+dot(dotOn(it.days,dk2),it.col,10)+'</div>';});
        h+='<div style="display:flex;align-items:center;gap:10px;'+
          'padding:8px 10px;border-radius:8px;margin-bottom:5px;'+
          'background:'+it.col+'0c;border:1px solid '+it.col+'1e;">'+
          '<div style="flex:1;">'+
            '<div style="font-family:Orbitron,monospace;font-size:9px;font-weight:700;'+
              'color:'+it.col+';text-shadow:0 0 8px '+it.col+';letter-spacing:1px;">'+it.name+'</div>'+
            (it.note?'<div style="font-size:9px;color:#445;font-family:monospace;margin-top:1px;">'+it.note+'</div>':'')+
            (it.days==='workout'?'<div style="font-size:8px;color:#ffb30088;font-family:monospace;">workout days only</div>':'')+
          '</div>'+
          '<div style="font-family:Orbitron,monospace;font-size:14px;font-weight:900;'+
            'color:'+it.col+';text-shadow:0 0 12px '+it.col+';white-space:nowrap;padding:0 12px;">'+it.dose+'</div>'+
          '<div style="display:flex;align-items:center;">'+dots+'</div>'+
        '</div>';
      });
      h+='</div>';
    });
    h+='</div>';
  });
  h+='</div>';
  return h;
}

function weeklyTable(){
  var h='<div style="border:1px solid #1a2030;border-radius:14px;overflow:hidden;margin-bottom:20px;">'+
    '<div style="background:linear-gradient(90deg,#00ff8810,#00cfff10,#bf5fff10);'+
      'padding:10px 14px;font-family:Orbitron,monospace;font-size:9px;font-weight:900;'+
      'letter-spacing:3px;color:#3a4a5a;">&#9670;  WEEKLY PROTOCOL OVERVIEW</div>'+
    '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">'+
    '<table style="width:100%;border-collapse:collapse;min-width:480px;">'+
    '<thead><tr style="background:#070b11;">'+
    '<th style="padding:7px 10px;text-align:left;font-size:8px;color:#334;'+
      'letter-spacing:1.5px;font-family:Orbitron,monospace;font-weight:700;white-space:nowrap;">PEPTIDE / SUPPLEMENT</th>';
  DAYS.forEach(function(d,i){
    var hi=S.tab===0&&S.day===i;
    h+='<th style="padding:7px 6px;text-align:center;font-size:8px;'+
      'font-family:Orbitron,monospace;font-weight:700;color:'+(hi?dayCol(i):'#334')+';">'+d+'</th>';
  });
  h+='</tr></thead><tbody>';
  TABLE.forEach(function(row,i){
    h+='<tr style="background:'+(i%2===0?'#07090f':'#090d15')+';"><td style="padding:5px 10px;font-size:9px;color:'+row.col+';font-family:monospace;white-space:nowrap;">'+row.name+'</td>';
    DK.forEach(function(dk2,di){
      var on=dotOn(row.days,dk2);
      var hi=S.tab===0&&S.day===di;
      h+='<td style="text-align:center;padding:5px 6px;background:'+(hi?dayCol(di)+'08':'transparent')+';">'+dot(on,row.col,10)+'</td>';
    });
    h+='</tr>';
  });
  h+='</tbody></table></div></div>';
  return h;
}

function render(){
  var h='';
  // Fixed BG
  h+='<div style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;pointer-events:none;'+
    'background-image:linear-gradient(rgba(0,200,255,.022) 1px,transparent 1px),'+
    'linear-gradient(90deg,rgba(0,200,255,.022) 1px,transparent 1px);background-size:40px 40px;"></div>';
  h+='<div style="position:fixed;top:-180px;left:-180px;width:500px;height:500px;border-radius:50%;'+
    'background:radial-gradient(circle,#00ff8810 0%,transparent 70%);pointer-events:none;z-index:0;"></div>';
  h+='<div style="position:fixed;bottom:-180px;right:-180px;width:500px;height:500px;border-radius:50%;'+
    'background:radial-gradient(circle,#bf5fff10 0%,transparent 70%);pointer-events:none;z-index:0;"></div>';

  // Main
  h+='<div style="position:relative;z-index:1;max-width:820px;margin:0 auto;padding:0 14px 50px;">';

  // Header
  h+='<div style="text-align:center;padding:24px 0 12px;">'+
    '<div style="font-family:Orbitron,monospace;font-size:clamp(14px,5vw,26px);font-weight:900;'+
      'letter-spacing:clamp(2px,1.5vw,5px);'+
      'background:linear-gradient(90deg,#00ff88,#00cfff,#bf5fff);'+
      '-webkit-background-clip:text;-webkit-text-fill-color:transparent;'+
      'filter:drop-shadow(0 0 18px #00cfff55);">DAVID\'S PEPTIDE PROTOCOL</div>'+
    '<div style="font-size:10px;letter-spacing:6px;color:#3a4a5a;margin-top:5px;'+
      'font-family:Rajdhani,sans-serif;">TRACK &middot; OPTIMIZE &middot; TRANSFORM</div>'+
    '<div style="width:70%;height:1px;margin:10px auto 0;'+
      'background:linear-gradient(to right,transparent,#00cfff55,transparent);"></div>'+
  '</div>';

  // Badges
  h+='<div style="display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;">';
  ['&#9208;  MOTS-C &mdash; Currently Out','&#9208;  Wolverine (BPC/TB-500) &mdash; Paused 4 Weeks'].forEach(function(t){
    h+='<div style="font-size:9px;padding:4px 12px;border:1px solid #ff445530;'+
      'border-radius:20px;color:#ff445599;font-family:monospace;letter-spacing:1px;'+
      'background:#ff44550a;">'+t+'</div>';
  });
  h+='</div>';

  // Tabs
  h+='<div style="display:flex;gap:6px;margin-bottom:14px;'+
    'background:#080c14;border-radius:12px;padding:5px;border:1px solid #1a2030;">';
  [['&#128197;  Daily Schedule',0],['&#128202;  Full Overview',1]].forEach(function(item){
    var on=S.tab===item[1];
    h+='<button onclick="setTab('+item[1]+')" style="'+
      'flex:1;padding:11px 0;border-radius:9px;border:none;'+
      'background:'+(on?'linear-gradient(135deg,#00ff8818,#00cfff18)':'transparent')+';'+
      'cursor:pointer;font-family:Orbitron,monospace;font-size:9px;font-weight:700;'+
      'letter-spacing:1.5px;color:'+(on?C.green:'#334')+';'+
      'text-shadow:'+(on?'0 0 12px '+C.green:'none')+';min-height:46px;">'+item[0]+'</button>';
  });
  h+='</div>';

  // Tab content
  h+=(S.tab===0?scheduleTab():overviewTab());

  // Weekly table
  h+=weeklyTable();

  // Footer
  h+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;">';
  [{icon:'&#127919;',text:'CONSISTENCY IS THE COMPOUND'},
   {icon:'&#128737;',text:'STAY DISCIPLINED'},
   {icon:'&#128202;',text:'TRACK EVERYTHING'},
   {icon:'&#128640;',text:'TRUST THE PROCESS'}].forEach(function(f){
    h+='<div style="background:#070b11;border:1px solid #111825;border-radius:10px;'+
      'padding:10px 6px;text-align:center;font-size:7px;letter-spacing:1.5px;'+
      'font-family:Orbitron,monospace;color:#283848;font-weight:700;">'+
      '<div style="font-size:18px;margin-bottom:5px;">'+f.icon+'</div>'+f.text+'</div>';
  });
  h+='</div>';
  h+='</div>';

  document.getElementById('app').innerHTML=h;
}

render();
</script>
</body>
</html>
